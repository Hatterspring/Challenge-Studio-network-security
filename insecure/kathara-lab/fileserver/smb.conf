[global]
    workgroup = CORP
    server string = FILESERVER
    security = user
    map to guest = Bad User
    log file = /var/log/samba/log.%m

[ot_docs]
    path = /srv/ot_docs
    browseable = yes
    guest ok = yes
    read only = no
    writable = yes
    # Vuln: no ACLs, guest write access to a share holding OT network
    # diagrams and default vendor credential sheets (T1048 exfil target).
