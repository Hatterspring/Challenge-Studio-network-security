LAB_DESCRIPTION="Vulnerable IT/OT range - Volt Typhoon (AA24-038A) + CyberAv3ngers (AA23-335A) + Iranian PLC campaign (AA26-097A)"
LAB_VERSION="1.0"
LAB_AUTHOR="student"

# ---------------------------------------------------------------------------
# Topology
#
#   internet -- edge-fw -- dmz -- dmz_it -- it_lan -- rtr-it-ot -- ot_dmz -- jumpbox -- ot_lan
#                            |                                                              |
#                            +---------------- (deliberately flat/no ACL) -------------------+
#
# The dmz<->ot_lan shortcut is intentional: it is the "PLC directly reachable
# from the internet" root cause that AA23-335A and AA26-097A both describe.
# The it_lan->ot_dmz->ot_lan path is the identity-based pivot Volt Typhoon
# used. Both paths exist simultaneously so one topology drives all three
# attack chains. Removing the shortcut interface is your first mitigation
# exercise.
# ---------------------------------------------------------------------------

attacker[0]="internet"
attacker[image]="kathara/base"
attacker[bridged]=true

edge_fw[0]="internet"
edge_fw[1]="dmz"
edge_fw[image]="kathara/base"
edge_fw[bridged]=true

dmz_it[0]="dmz"
dmz_it[1]="it_lan"
dmz_it[image]="kathara/base"

dc01[0]="it_lan"
dc01[image]="kathara/base"
dc01[bridged]=true

fileserver[0]="it_lan"
fileserver[image]="kathara/base"
fileserver[bridged]=true

admin[0]="it_lan"
admin[image]="kathara/base"
admin[bridged]=true

it_ot[0]="it_lan"
it_ot[1]="ot_dmz"
it_ot[image]="kathara/base"

jumpbox[0]="ot_dmz"
jumpbox[1]="ot_lan"
jumpbox[image]="kathara/base"
jumpbox[bridged]=true

# Dual-homed on purpose: reachable directly from dmz (bad) AND from ot_lan.
unitronics[0]="ot_lan"
unitronics[1]="dmz"
unitronics[image]="kathara/base"
unitronics[bridged]=true

rockwell[0]="ot_lan"
rockwell[1]="dmz"
rockwell[image]="kathara/base"
rockwell[bridged]=true

hmi_scada[0]="ot_lan"
hmi_scada[image]="kathara/base"
hmi_scada[bridged]=true
